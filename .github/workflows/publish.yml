name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # 1. This must match the environment name in your npm settings screenshot
    environment: Kimo 
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build core
        run: cd packages/core && pnpm build

      - name: Build react
        run: cd packages/react && pnpm build

      # 2. Removed the secrets.NPM_TOKEN requirement. 
      # pnpm will use the OIDC token automatically because of 'id-token: write' and 'environment: Kimo'
      - name: Publish @kimo-emoji/core
        run: cd packages/core && pnpm publish --no-git-checks --access public --provenance

      - name: Publish @kimo-emoji/react
        run: cd packages/react && pnpm publish --no-git-checks --access public --provenance
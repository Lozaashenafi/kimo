<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Thinking -->
  <ellipse cx="26" cy="72" rx="13" ry="8" fill="#FFA3BA" fill-opacity="0.5"/>
  <ellipse cx="102" cy="72" rx="13" ry="8" fill="#FFA3BA" fill-opacity="0.5"/>

  <!-- Left Eyebrow (curled up in contemplation) -->
  <path d="M30 30 C36 24 48 26 54 34" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right Eyebrow (slanted down) -->
  <path d="M74 38 C80 34 92 36 98 40" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Looking Up Eyes -->
  <ellipse cx="44" cy="48" rx="9" ry="11" fill="#1E1F24"/>
  <circle cx="46" cy="43" r="3.5" fill="#FFFFFF"/>

  <ellipse cx="88" cy="48" rx="9" ry="11" fill="#1E1F24"/>
  <circle cx="90" cy="43" r="3.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <circle cx="64" cy="65" r="2.2" fill="#1E1F24"/>

  <!-- Puckered / thoughtful side mouth -->
  <path d="M50 78 C56 74 68 76 74 82" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Hand resting on chin -->
  <g transform="translate(68, 76)">
    <!-- Palm / Fingers -->
    <path d="M4 14 C12 6 24 10 24 22 C24 30 14 36 2 34 C-6 33 -10 26 -6 20 C-4 18 0 18 4 14 Z" fill="#FFE5D9" stroke="#1E1F24" stroke-width="3.5"/>
    <path d="M-2 18 C-1 8 8 10 12 18" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 12 C14 8 20 12 20 18" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

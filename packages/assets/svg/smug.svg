  <ellipse cx="102" cy="74" rx="14" ry="8" fill="#FFA3BA" fill-opacity="0.6"/>

  <!-- Left Eyebrow raised, Right Eyebrow slanted -->
  <path d="M28 28 C36 22 48 24 54 30" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M74 34 C80 34 92 32 98 36" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Half-closed / Sly sidelong eyes -->
  <!-- Left Eye -->

  <path d="M34 54 Q44 58 52 54" stroke="#1E1F24" stroke-width="2.5"/>

  <!-- Right Eye -->
  <path d="M74 52 C80 46 92 46 96 52" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="86" cy="53" rx="6" ry="6" fill="#1E1F24"/>
  <circle cx="88" cy="51" r="2" fill="#FFFFFF"/>
  <path d="M76 54 Q86 58 94 54" stroke="#1E1F24" stroke-width="2.5"/>

  <!-- Asymmetric Smug Smirk -->
  <path d="M48 80 C60 80 82 86 86 68" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M84 68 C86 66 90 70 86 74" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>
</svg>

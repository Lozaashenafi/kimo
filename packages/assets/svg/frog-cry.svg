<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Frog Cry (Inspired by Reference 2) -->
  <!-- Frog Body / Head Contour -->
  <path d="M24 64 C24 44 32 38 42 38 C48 38 52 42 56 46 C60 46 68 46 72 46 C76 42 80 38 86 38 C96 38 104 44 104 64 C104 90 92 108 64 108 C36 108 24 90 24 64 Z" 
        fill="#AACC00" stroke="#1E1F24" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Frog Eye Bulges -->
  <circle cx="44" cy="38" r="14" fill="#AACC00" stroke="#1E1F24" stroke-width="4"/>
  <!-- Weeping squint eyes -->
  <path d="M36 38 C40 32 48 32 52 38" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <circle cx="84" cy="38" r="14" fill="#AACC00" stroke="#1E1F24" stroke-width="4"/>
  <path d="M76 38 C80 32 88 32 92 38" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Tears Splash from eyes -->
  <path d="M38 46 C32 58 24 74 24 94 C30 94 36 94 38 94 C36 74 42 58 46 46 Z" fill="#4CC9F0" fill-opacity="0.8" stroke="#1E1F24" stroke-width="2.5"/>
  <circle cx="18" cy="80" r="3.5" fill="#4CC9F0"/>

  <!-- Right Tears Splash from eyes -->
  <path d="M90 46 C96 58 104 74 104 94 C98 94 92 94 90 94 C92 74 86 58 82 46 Z" fill="#4CC9F0" fill-opacity="0.8" stroke="#1E1F24" stroke-width="2.5"/>
  <circle cx="110" cy="80" r="3.5" fill="#4CC9F0"/>

  <!-- Blushing cheeks under tears -->
  <ellipse cx="32" cy="74" rx="7" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>
  <ellipse cx="96" cy="74" rx="7" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>

  <!-- Open Weeping Wobbly Frog Mouth -->
  <path d="M44 70 C44 70 48 94 64 94 C80 94 84 70 84 70 Z" fill="#E63946" stroke="#1E1F24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M50 86 C56 82 72 82 78 86 Z" fill="#FF85A1"/>
</svg>
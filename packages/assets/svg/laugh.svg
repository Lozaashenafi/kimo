  <ellipse cx="102" cy="74" rx="15" ry="9" fill="#FFA3BA" fill-opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M28 32 C36 26 48 26 56 32" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M72 32 C80 26 92 26 100 32" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Closed Joy Eyes (Upside down U / arcs) -->

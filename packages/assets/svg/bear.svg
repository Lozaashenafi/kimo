  <!-- Bear Nose & Smile -->
  <ellipse cx="64" cy="74" rx="7" ry="5" fill="#1E1F24"/>
  <path d="M64 79 L64 85" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>
  <path d="M56 86 C60 90 68 90 72 86" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>

  <path d="M72 34 C76 30 92 30 96 34" stroke="#1E1F24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="34" cy="68" rx="8" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>
  <ellipse cx="94" cy="68" rx="8" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>
  <!-- Gentle content smile -->
  <path d="M46 72 C52 82 76 82 82 72" stroke="#1E1F24" stroke-width="4" stroke-linecap="round" fill="none"/>

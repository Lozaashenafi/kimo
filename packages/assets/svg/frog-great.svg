<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Frog Great - Confident & Triumphant -->
  <!-- Sparkles of victory -->
  <path d="M18 22 L20 28 L26 30 L20 32 L18 38 L16 32 L10 30 L16 28 Z" fill="#FFD166"/>
  <path d="M108 18 L110 24 L116 26 L110 28 L108 34 L106 28 L100 26 L106 24 Z" fill="#FFD166"/>
  <!-- Frog Body -->
  <path d="M24 64 C24 44 32 38 42 38 C48 38 52 42 56 46 C60 46 68 46 72 46 C76 42 80 38 86 38 C96 38 104 44 104 64 C104 90 92 108 64 108 C36 108 24 90 24 64 Z" 
        fill="#AACC00" stroke="#1E1F24" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Frog Belly -->
  <path d="M40 82 C40 70 50 64 64 64 C78 64 88 70 88 82 C88 98 78 104 64 104 C50 104 40 98 40 82 Z" fill="#E9F5DB"/>
  <!-- Left Eye Bulge -->
  <circle cx="44" cy="38" r="14" fill="#AACC00" stroke="#1E1F24" stroke-width="4"/>
  <circle cx="44" cy="36" r="6.5" fill="#1E1F24"/>
  <circle cx="46" cy="34" r="2.2" fill="#FFFFFF"/>
  <!-- Right Eye Bulge -->
  <circle cx="84" cy="38" r="14" fill="#AACC00" stroke="#1E1F24" stroke-width="4"/>
  <circle cx="84" cy="36" r="6.5" fill="#1E1F24"/>
  <circle cx="86" cy="34" r="2.2" fill="#FFFFFF"/>
  <!-- Confident raised eyebrows -->
  <path d="M34 28 C38 24 48 24 52 28" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 28 C80 24 90 24 94 28" stroke="#1E1F24" stroke-width="3" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="34" cy="68" rx="8" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>
  <ellipse cx="94" cy="68" rx="8" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>
  <!-- Wide confident grin -->
  <path d="M38 68 C44 92 84 92 90 68" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round" fill="#E63946"/>
  <path d="M48 78 C56 84 72 84 80 78" fill="#FF85A1"/>
  <!-- Raised triumphant arms -->
  <path d="M24 68 C16 56 14 40 20 34 C24 30 28 36 26 48" stroke="#1E1F24" stroke-width="3.5" stroke-linecap="round" fill="#AACC00"/>
  <path d="M104 68 C112 56 114 40 108 34 C104 30 100 36 102 48" stroke="#1E1F24" stroke-width="3.5" stroke-linecap="round" fill="#AACC00"/>
  <!-- Fist bumps -->
  <circle cx="20" cy="32" r="6" fill="#AACC00" stroke="#1E1F24" stroke-width="2.5"/>
  <circle cx="108" cy="32" r="6" fill="#AACC00" stroke="#1E1F24" stroke-width="2.5"/>
</svg>
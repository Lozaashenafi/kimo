<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Peace / Victory Sign -->
  <!-- Hand Body -->
  <path d="M42 108 L42 76 C42 66 52 66 52 76 L52 82 C52 72 62 72 62 82 L62 88 C62 78 72 78 72 88 L72 108 Z" 
        fill="#FFE5D9" stroke="#1E1F24" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Index Finger pointing up -->
  <path d="M42 76 L42 30 C42 22 52 22 52 30 L52 76" fill="#FFE5D9" stroke="#1E1F24" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Middle Finger pointing up angled -->
  <path d="M54 76 L66 26 C68 18 78 22 76 30 L64 76" fill="#FFE5D9" stroke="#1E1F24" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Folded Thumb -->
  <path d="M38 78 C30 76 26 84 36 90 L46 90" stroke="#1E1F24" stroke-width="4" stroke-linecap="round" fill="#FFE5D9"/>
  <!-- Sparkles -->
  <path d="M92 24 L94 30 L100 32 L94 34 L92 40 L90 34 L84 32 L90 30 Z" fill="#FFD166"/>
</svg>

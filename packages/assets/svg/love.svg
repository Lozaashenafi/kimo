<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Love / Heart Eyes -->
  <!-- Cheeks Blush -->
  <ellipse cx="26" cy="78" rx="16" ry="10" fill="#FF758F" fill-opacity="0.6"/>
  <ellipse cx="102" cy="78" rx="16" ry="10" fill="#FF758F" fill-opacity="0.6"/>

  <!-- Eyebrows -->
  <path d="M28 32 C36 26 48 28 54 34" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M74 34 C80 28 92 26 100 32" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Heart Eyes -->
  <g transform="translate(42, 52) scale(0.95)">
    <path d="M0,6 A6,6 0 0,0 -12,-6 A6,6 0 0,0 -24,6 Q-24,18 0,30 Q24,18 24,6 A6,6 0 0,0 12,-6 A6,6 0 0,0 0,6 Z" 
          transform="translate(0, -10)" 
          fill="#FF2A6D" stroke="#1E1F24" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#FFFFFF"/>
  </g>

  <g transform="translate(86, 52) scale(0.95)">
    <path d="M0,6 A6,6 0 0,0 -12,-6 A6,6 0 0,0 -24,6 Q-24,18 0,30 Q24,18 24,6 A6,6 0 0,0 12,-6 A6,6 0 0,0 0,6 Z" 
          transform="translate(0, -10)" 
          fill="#FF2A6D" stroke="#1E1F24" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Open Kiss / Drool Joy Mouth -->
  <path d="M48 80 C52 96 76 96 80 80" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round" fill="#FF5E7E"/>
  <!-- Drool Bubble / Sparkle -->
  <path d="M68 88 Q72 102 66 102 Q60 102 64 88" fill="#4CC9F0" fill-opacity="0.85" stroke="#1E1F24" stroke-width="2.5"/>
</svg>

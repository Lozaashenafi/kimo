<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Frog Happy (Inspired by Reference 2) -->
  <!-- Frog Body / Head Contour -->
  <path d="M24 64 C24 44 32 38 42 38 C48 38 52 42 56 46 C60 46 68 46 72 46 C76 42 80 38 86 38 C96 38 104 44 104 64 C104 90 92 108 64 108 C36 108 24 90 24 64 Z" 
        fill="#AACC00" stroke="#1E1F24" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Frog Belly Pale Patch -->
  <path d="M40 82 C40 70 50 64 64 64 C78 64 88 70 88 82 C88 98 78 104 64 104 C50 104 40 98 40 82 Z" fill="#E9F5DB"/>

  <!-- Frog Raised Eye Bulges -->
  <!-- Left Eye Bulge & Bead Eye -->
  <circle cx="44" cy="38" r="14" fill="#AACC00" stroke="#1E1F24" stroke-width="4"/>
  <circle cx="44" cy="36" r="6.5" fill="#1E1F24"/>
  <circle cx="46" cy="34" r="2.2" fill="#FFFFFF"/>

  <!-- Right Eye Bulge & Bead Eye -->
  <circle cx="84" cy="38" r="14" fill="#AACC00" stroke="#1E1F24" stroke-width="4"/>
  <circle cx="84" cy="36" r="6.5" fill="#1E1F24"/>
  <circle cx="86" cy="34" r="2.2" fill="#FFFFFF"/>

  <!-- Soft Pink Blush on Frog Cheeks -->
  <ellipse cx="34" cy="68" rx="8" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>
  <ellipse cx="94" cy="68" rx="8" ry="5" fill="#FF8BA7" fill-opacity="0.75"/>

  <!-- Wide Happy Frog Mouth -->
  <path d="M42 66 C42 66 48 88 64 88 C80 88 86 66 86 66 Z" fill="#E63946" stroke="#1E1F24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M52 82 C56 76 72 76 76 82 Z" fill="#FF85A1"/>
  
  <!-- Tiny Joy Arms raised slightly -->
  <path d="M24 74 C16 70 12 60 16 54 C20 48 24 56 26 62" stroke="#1E1F24" stroke-width="3.5" stroke-linecap="round" fill="#AACC00"/>
  <path d="M104 74 C112 70 116 60 112 54 C108 48 104 56 102 62" stroke="#1E1F24" stroke-width="3.5" stroke-linecap="round" fill="#AACC00"/>

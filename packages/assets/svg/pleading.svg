<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Kimo Emoji: Pleading Face (Puppy Eyes) -->
  <ellipse cx="28" cy="80" rx="15" ry="9" fill="#FFA3BA" fill-opacity="0.7"/>
  <ellipse cx="100" cy="80" rx="15" ry="9" fill="#FFA3BA" fill-opacity="0.7"/>
  <!-- Eyebrows raised and angled in pity -->
  <path d="M30 36 C38 42 48 42 54 36" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M74 36 C80 42 90 42 98 36" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left Giant Puppy Eye -->
  <ellipse cx="42" cy="58" rx="16" ry="18" fill="#1E1F24"/>
  <circle cx="48" cy="50" r="7.5" fill="#FFFFFF"/>
  <circle cx="36" cy="66" r="3.8" fill="#FFFFFF"/>
  <circle cx="46" cy="68" r="2.2" fill="#FFFFFF"/>
  <!-- Right Giant Puppy Eye -->
  <ellipse cx="86" cy="58" rx="16" ry="18" fill="#1E1F24"/>
  <circle cx="92" cy="50" r="7.5" fill="#FFFFFF"/>
  <circle cx="80" cy="66" r="3.8" fill="#FFFFFF"/>
  <circle cx="90" cy="68" r="2.2" fill="#FFFFFF"/>
  <!-- Trembling Pout Mouth -->
  <path d="M54 88 C58 84 70 84 74 88" stroke="#1E1F24" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Teardrop glistening near eye -->
  <path d="M98 72 C104 76 104 84 98 86 C94 86 92 80 98 72 Z" fill="#70D6FF" stroke="#1E1F24" stroke-width="2.5"/>
</svg>
